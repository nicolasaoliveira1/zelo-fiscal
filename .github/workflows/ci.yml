name: CI

on:
  # `push:` sem filtro rodava DUAS vezes por commit em branch com PR aberto (uma
  # pelo push, outra pelo pull_request) — o mesmo commit, o mesmo resultado, o
  # dobro do tempo de fila. Push cobre a main (guarda do que ja foi mergeado) e o
  # PR cobre o resto; nenhum commit fica sem CI.
  # paths-ignore: so caminhos INERTES, que nenhum teste le e nenhum codigo abre em
  # runtime (verificado: as unicas mencoes a .specs/docs no app/ sao comentario).
  # Qualquer .py, template, JS, requirements* ou o proprio workflow continua
  # rodando o gate rápido — lá mora tudo que pode quebrar. A paridade MySQL tem
  # workflow próprio, condicionado a mudanças de backend/banco e agenda noturna.
  # A lista esta DUPLICADA de proposito. Reusa-la por ancora/alias YAML
  # (`&nome` / `*nome`) quebra o gatilho que usa o ALIAS: o parser do GitHub nao
  # resolve a referencia, e `pull_request` para de disparar — sem erro, sem
  # startup_failure, com o workflow ainda "active". O `push` continuava rodando
  # porque carregava a definicao seguida da lista literal, o que torna a falha
  # ainda mais dificil de ver: CI verde na main e PR nenhum sem check.
  # Ao editar, altere as DUAS listas.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.specs/**'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.specs/**'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

# Push seguido de push na mesma branch cancela a execucao anterior: o resultado
# do commit intermediario ja nasce obsoleto e so ocupa runner. A main fica de
# fora (`cancel-in-progress: false`) porque ali cada commit e um ponto de
# historico que se quer verde individualmente.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Gate rapido: lint + suite em SQLite (comportamento historico do CI). Roda em
  # todo PR e em push na main — e o gate que mantem a main verde e rapida.
  testes-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PR em rascunho nao roda: push de WIP nao precisa queimar runner, e nada e
    # mergeado em draft. O guard do event_name e obrigatorio — em push a
    # `github.event.pull_request` nem existe, e sem ele a condicao daria falso e
    # pularia o CI da main, exatamente o oposto do que se quer. Marcar o PR como
    # "ready for review" dispara o CI.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      # -n auto: um processo por vCPU do runner. Cada worker recebe o seu proprio
      # SQLite temporario (o mkstemp do conftest roda por processo), entao nao ha
      # banco compartilhado entre eles.
      - name: Testes (pytest, SQLite)
        run: pytest -q -n auto
