name: CI

on:
  # O gate rápido roda em todo PR e em push na main. Assim, uma proteção de
  # branch pode exigir sempre um check concluído, inclusive em alterações de
  # documentação, sem obrigar o job caro do MySQL a acompanhar cada mudança.
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Push seguido de push na mesma branch cancela a execucao anterior: o resultado
# do commit intermediario ja nasce obsoleto e so ocupa runner. A main fica de
# fora (`cancel-in-progress: false`) porque ali cada commit e um ponto de
# historico que se quer verde individualmente.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Gate rápido: lint + suíte em SQLite. Roda em todo PR e em push na main — é
  # o gate que mantém a main verde e rápida.
  testes-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PR em rascunho nao roda: push de WIP nao precisa queimar runner, e nada e
    # mergeado em draft. O guard do event_name e obrigatorio — em push a
    # `github.event.pull_request` nem existe, e sem ele a condicao daria falso e
    # pularia o CI da main, exatamente o oposto do que se quer. Marcar o PR como
    # "ready for review" dispara o CI.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      # O repositorio e publico e o historico do git nao esquece: trocar o valor
      # depois nao apaga o commit. Este check reprova documento real (CNPJ/CPF
      # com DV valido, chave de NF-e) fora da lista de sinteticos declarados em
      # `tools/verificar_dados_sensiveis.py`.
      - name: Dados sensíveis em arquivo versionado
        run: python tools/verificar_dados_sensiveis.py

      # -n auto: um processo por vCPU do runner. Cada worker recebe o seu próprio
      # SQLite temporário (o mkstemp do conftest roda por processo), então não há
      # banco compartilhado entre eles.
      - name: Testes (pytest, SQLite)
        run: pytest -q -n auto --timeout=120 --timeout-method=thread

  # Gate rápido do frontend: sintaxe, contratos JSDoc e testes sem rede ou
  # navegador real. Roda em todo PR e em push na main, em paralelo ao Python.
  testes-javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências JavaScript
        run: npm ci

      - name: Verificar sintaxe JavaScript
        run: npm run js:syntax

      - name: Verificar tipos descritos com JSDoc
        run: npm run js:types

      - name: Testes JavaScript
        run: npm test
