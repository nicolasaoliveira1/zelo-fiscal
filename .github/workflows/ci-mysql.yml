name: CI MySQL

on:
  # O workflow é criado em todo PR e push para que o check nunca fique ausente
  # por causa de um filtro de caminho. O detector abaixo decide se o job caro
  # precisa ser executado; a agenda noturna e a execução manual sempre forçam
  # a paridade completa.
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: ci-mysql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  detectar-mudancas:
    runs-on: ubuntu-latest
    outputs:
      precisa_mysql: ${{ steps.detectar.outputs.precisa_mysql }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verificar caminhos que exigem MySQL
        id: detectar
        env:
          EVENTO: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          HEAD_PR: ${{ github.event.pull_request.head.sha }}
          ANTES_PUSH: ${{ github.event.before }}
          SHA_ATUAL: ${{ github.sha }}
        run: |
          set -euo pipefail

          precisa_mysql=false
          arquivos=''
          case "$EVENTO" in
            schedule|workflow_dispatch)
              precisa_mysql=true
              ;;
            pull_request)
              arquivos="$(git diff --name-only "$BASE_PR" "$HEAD_PR")"
              ;;
            push)
              if [[ -z "$ANTES_PUSH" || "$ANTES_PUSH" =~ ^0+$ ]]; then
                precisa_mysql=true
              else
                arquivos="$(git diff --name-only "$ANTES_PUSH" "$SHA_ATUAL")"
              fi
              ;;
            *)
              precisa_mysql=true
              ;;
          esac

          if [[ "$precisa_mysql" == false ]]; then
            while IFS= read -r arquivo; do
              if [[ "$arquivo" =~ ^app/.*\.py$ ||
                    "$arquivo" =~ ^(config|run)\.py$ ||
                    "$arquivo" =~ ^migrations/ ||
                    "$arquivo" =~ ^tests/ ||
                    "$arquivo" =~ ^requirements[^/]*\.txt$ ||
                    "$arquivo" == 'pyproject.toml' ||
                    "$arquivo" == 'Dockerfile' ||
                    "$arquivo" == 'docker-compose.yml' ||
                    "$arquivo" =~ ^\.github/workflows/ ]]; then
                precisa_mysql=true
                break
              fi
            done <<< "$arquivos"
          fi

          echo "precisa_mysql=$precisa_mysql" >> "$GITHUB_OUTPUT"

  testes-mysql:
    needs: detectar-mudancas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # PR em rascunho não roda: o SQLite continua sendo o feedback rápido assim
    # que o PR estiver pronto para revisão. Se o detector falhar, o job também
    # deve rodar e falhar de forma visível, em vez de ficar apenas como skipped.
    if: >-
      always() &&
      (
        needs.detectar-mudancas.result == 'failure' ||
        needs.detectar-mudancas.outputs.precisa_mysql == 'true'
      ) &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sistema_certidoes_test
        ports:
          - 3306:3306
        # MySQL 8.0 já usa utf8mb4 / utf8mb4_0900_ai_ci por padrão (igual à produção).
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      # A imagem oficial do MySQL sobe um servidor temporário, roda o init (cria o
      # MYSQL_DATABASE) e reinicia; espera uma query real no banco alvo para evitar
      # a corrida de boot antes do pytest.
      - name: Aguardar MySQL ficar realmente pronto
        run: |
          for i in $(seq 1 30); do
            if mysql -h 127.0.0.1 -uroot -proot -e "SELECT 1" sistema_certidoes_test >/dev/null 2>&1; then
              echo "MySQL pronto (query real no banco alvo OK)"; exit 0
            fi
            echo "aguardando MySQL... ($i)"; sleep 2
          done
          echo "MySQL não ficou pronto a tempo"; exit 1

      - name: Testes (pytest, MySQL 8.0)
        env:
          # O schema é criado uma vez por worker; os fixtures limpam os dados
          # entre testes sem mascarar falhas de compatibilidade do MySQL.
          TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/sistema_certidoes_test?charset=utf8mb4
          AUTO_DB_UPGRADE: '0'
        # --timeout transforma hang em falha nomeada. Cada worker recebe seu
        # banco próprio pelo conftest, sem compartilhar tabelas.
        run: pytest -q -n auto --timeout=120 --timeout-method=thread

      # Migração idempotente contra MySQL real, em banco dedicado. O passo falha
      # o job se qualquer comando falhar.
      - name: Migração idempotente (upgrade → downgrade → upgrade)
        env:
          FLASK_APP: run.py
          AUTO_DB_UPGRADE: '0'
          SECRET_KEY: ci-mig
          DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/sistema_certidoes_mig?charset=utf8mb4
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS sistema_certidoes_mig CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"
          flask db upgrade head
          flask db downgrade -- -1
          flask db upgrade head
          flask db current | grep -q '(head)'
