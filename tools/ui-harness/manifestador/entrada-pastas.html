<!doctype html>
<!--
  Harness isolado do painel "Adicionar chaves" com a lista de pastas cheia.
  NÃO faz parte do app: replica o markup real de app/templates/manifestador.html
  e o style.css real para medir se o painel — que é `position: fixed` ancorado no
  rodapé e cresce para CIMA — cabe na tela com as 26 pastas de um mês normal.

  O defeito que ele existe para pegar: sem teto de altura, o topo do painel e o
  botão de importar saem da viewport e ficam inalcançáveis.

  Medido por tools/ui-harness/manifestador/shot_entrada_pastas.py.
-->
<html lang="pt-br" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harness · Manifestador / pastas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../../app/static/css/style.css">
</head>

<body>
  <main class="container-fluid app-main mt-4">
    <p class="text-secondary small">Fundo da página (a fila de chaves fica aqui).</p>
  </main>

  <section class="manif-entrada" id="manifEntrada" aria-label="Adicionar chaves">
    <div class="manif-entrada-in">
      <div>
        <div class="d-flex justify-content-between align-items-center mb-2">
          <span class="manif-eyebrow">Colar chaves</span>
          <button type="button" class="btn btn-ghost btn-sm py-0" id="manifFecharEntrada">Fechar</button>
        </div>
        <select class="form-select form-select-sm mb-2" id="manifEntradaEmpresa">
          <option value="">Escolha a empresa…</option>
        </select>
        <label class="manif-eyebrow d-block mb-1" for="manifEntradaCompetencia">
          Competência destas notas
        </label>
        <input type="month" class="form-control form-control-sm mb-2" id="manifEntradaCompetencia">
        <textarea class="form-control manif-ta" id="manifTexto" rows="4"
                  placeholder="Cole aqui — do scanner ou do PDF."></textarea>
        <button type="button" class="btn btn-primary btn-sm w-100 mt-2" id="manifImportar">Importar</button>
      </div>
      <div>
        <span class="manif-eyebrow d-block mb-2">Ou os XML do mês</span>
        <div class="manif-solta" id="manifSolta">
          <i class="bi bi-folder2-open" aria-hidden="true"></i>
          <span>Arraste as pastas aqui — várias de uma vez, subpastas incluídas.<br>
            A empresa sai de dentro de cada nota.</span>
          <div class="manif-solta-acoes">
            <button type="button" class="btn btn-ghost btn-sm py-0">Escolher pasta</button>
            <button type="button" class="btn btn-ghost btn-sm py-0">Escolher arquivos</button>
          </div>
        </div>

        <p class="manif-fontes-resumo mt-2 mb-0" id="manifFontesResumo"></p>
        <ul class="manif-fontes" id="manifFontes"></ul>

        <button type="button" class="btn btn-soft-primary btn-sm w-100 mt-2" id="manifImportarXml"></button>
        <p class="manif-progresso mt-2 mb-0" id="manifProgresso" hidden></p>
        <div class="manif-balanco mt-2" id="manifBalanco"></div>
      </div>
    </div>
  </section>

  <script>
    /* As 26 pastas do print que quebrou a tela, com as contagens reais. */
    const PASTAS = [
      ['02 M NUNES', 31], ['03 PETRY MENEZES', 26], ['05 I ARAUJO', 18],
      ['08 TIAGO R', 24], ['09 LEANDRO', 42], ['13 RESTAURANTE GALETAO', 85],
      ['16 PADARIA', 84], ['23 L LUIS PETRY', 32], ['25 STUDIO', 62],
      ['30 GILBERTO', 14], ['45 VALERIA', 48], ['46 EDIR', 83],
      ['49 T GONCALVES', 48], ['51 DANIELI', 14], ['54 JOAO JUNIOR', 21],
      ['65 ALUMAP', 61], ['65-ALUMAP FILIAL', 3], ['77 AGROPECUARIA MARILUZ', 45],
      ['81 MADEIRAS TAPIA', 22], ['96 .EVERTON MATRIZ', 27], ['96 EVERTON FL1', 39],
      ['97 D GARCIA', 42], ['101 .VIDA E SAUDE MATRIZ', 121],
      ['101 VIDA E SAUDE FL1', 127], ['101 VIDA E SAUDE FL2', 134],
      ['110 ULTIMA PASTA COM NOME BEM COMPRIDO PARA TESTAR O CORTE', 55],
    ];

    function pintar(quantas) {
      const usadas = PASTAS.slice(0, quantas);
      document.getElementById('manifFontes').innerHTML = usadas.map(([nome, n], i) => `
        <li>
          <i class="bi bi-folder2" aria-hidden="true"></i>
          <span class="manif-fonte-nome" title="${nome}">${nome}</span>
          <span class="manif-fonte-num">${n} XML</span>
          <button type="button" class="btn btn-ghost btn-sm py-0 px-1" data-fonte="${i}"
                  aria-label="Tirar ${nome} da lista">
            <i class="bi bi-x-lg" aria-hidden="true"></i>
          </button>
        </li>`).join('');

      const resumo = document.getElementById('manifFontesResumo');
      resumo.hidden = !usadas.length;
      resumo.textContent = usadas.length === 1
        ? '1 pasta escolhida' : `${usadas.length} pastas escolhidas`;

      const total = usadas.reduce((s, [, n]) => s + n, 0);
      const botao = document.getElementById('manifImportarXml');
      botao.disabled = !total;
      botao.textContent = total
        ? `Importar ${total.toLocaleString('pt-BR')} XML` : 'Importar XML';
    }

    /* O que o Playwright lê. Tudo em coordenadas de viewport: o defeito era
       justamente conteúdo POSICIONADO fora dela. */
    window.medirPainel = () => {
      const painel = document.getElementById('manifEntrada');
      const botao = document.getElementById('manifImportarXml');
      const lista = document.getElementById('manifFontes');
      const fechar = document.getElementById('manifFecharEntrada');
      const alturaTela = window.innerHeight;
      const cabe = (el) => {
        const r = el.getBoundingClientRect();
        return r.top >= 0 && r.bottom <= alturaTela + 0.5;
      };
      return {
        alturaTela,
        topoDoPainel: Math.round(painel.getBoundingClientRect().top),
        alturaDoPainel: Math.round(painel.getBoundingClientRect().height),
        painelCabe: cabe(painel),
        botaoImportarVisivel: cabe(botao),
        botaoFecharVisivel: cabe(fechar),
        listaRola: lista.scrollHeight > lista.clientHeight + 1,
        paginaRolaNaHorizontal:
          document.documentElement.scrollWidth > document.documentElement.clientWidth,
      };
    };

    window.pintar = pintar;
    pintar(26);
  </script>
</body>

</html>
